apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanaka-backend
  labels:
    app: kanaka-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kanaka-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: kanaka-backend
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: kanaka-backend
        image: kanakaprotocol/backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 20
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          failureThreshold: 30
          periodSeconds: 10
        env:
        - name: NODE_ENV
          value: "production"
        - name: BLOCKCHAIN_RPC_URL
          valueFrom:
            secretKeyRef:
              name: kanaka-secrets
              key: blockchain-rpc-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: kanaka-secrets
              key: jwt-secret
        - name: ADMIN_ADDRESSES
          valueFrom:
            secretKeyRef:
              name: kanaka-secrets
              key: admin-addresses
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kanaka-secrets
              key: redis-password
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: kanaka-secrets
              key: api-keys
        - name: CORS_ORIGINS
          value: "https://app.kanaka.io,https://admin.kanaka.io"
        # Resources already defined above, removing duplicate
        # Probes already defined above, removing duplicates
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kanaka-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: kanaka-backend
  labels:
    app: kanaka-backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: kanaka-backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanaka-backend-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard